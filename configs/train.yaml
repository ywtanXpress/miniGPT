# configs/train.yaml

seed: 1337

paths:
  tokenizer_dir: "artifacts/tokenizer/step2_bpe"
  tokens_dir: "data/processed/step2_tokens"
  out_dir: "artifacts/pretrain/step3_gpt"

data:
  shard_prefix: "tok"
  val_num_shards: 1   # last N shards reserved for validation
  batch_size: 16
  block_size: 256

model:
  n_layer: 4
  n_head: 4
  n_embd: 256
  dropout: 0.1

train:
  max_steps: 2000
  grad_accum: 4
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_grad_norm: 1.0

  eval_interval: 200
  eval_batches: 50
  save_interval: 500
  log_interval: 20

  device: "auto"     # "auto" | "cpu" | "cuda"
  dtype: "auto"      # "auto" | "fp32" | "bf16"
